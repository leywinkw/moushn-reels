<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шоурил · ИИ-генератор контента</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#c{display:block;width:min(100vw,177.7778vh);height:min(56.25vw,100vh);background:#07060f;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
/* ===== ЯДРО ===== */
const W=1920,H=1080,FPS=60,DUR=15,TOTAL=FPS*DUR;
const view=document.getElementById('c'),out=view.getContext('2d');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const buf=mk(W,H),X=buf.getContext('2d');
const chn=mk(W,H),CH=chn.getContext('2d');

const F='"Inter","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif';
const D='"Inter","Montserrat","Arial Black","Segoe UI Black","Helvetica Neue",Arial,sans-serif';
const M='"JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace';
const P={bg:'#07060f',cy:'#29e7ff',mg:'#ff2fd1',lm:'#c6ff3d',or:'#ff8b22',vi:'#7b5cff',wh:'#f5f3ff',dim:'rgba(245,243,255,.55)'};
const TAU=Math.PI*2;

const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pr=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  o2:t=>1-(1-t)*(1-t),
  o3:t=>1-Math.pow(1-t,3),
  o5:t=>1-Math.pow(1-t,5),
  i3:t=>t*t*t,
  i5:t=>t*t*t*t*t,
  io3:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  ob:t=>{const a=1.9,b=a+1;return 1+b*Math.pow(t-1,3)+a*Math.pow(t-1,2)}
};
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
const font=(wt,sz,f=F)=>{X.font=`${wt} ${sz}px ${f}`};
function fit(s,wt,max,maxW,f=D){font(wt,max,f);const w=X.measureText(s).width;return w>maxW?max*maxW/w:max}
function grad(x0,y0,x1,y1,cols){const g=X.createLinearGradient(x0,y0,x1,y1);cols.forEach((c,i)=>g.addColorStop(i/(cols.length-1),c));return g}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function mask(x,y,w,h,fn){X.save();X.beginPath();X.rect(x,y,w,h);X.clip();fn();X.restore()}
function letters(s,cx,cy,sp,fn){const cs=[...s],ws=cs.map(c=>X.measureText(c).width),tot=ws.reduce((a,b)=>a+b,0)+sp*(cs.length-1);let px=cx-tot/2;X.textAlign='center';cs.forEach((c,i)=>{fn(c,i,px+ws[i]/2,cy,ws[i]);px+=ws[i]+sp});return tot}
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
let FR=0,ink=P.wh;
const GL='АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЫЭЮЯ0123456789#%&*+=/<>';
function scr(s,p,seed=0){
  if(p>=1)return s;let o='';const n=s.length;
  for(let i=0;i<n;i++){const c=s[i];if(c===' '){o+=' ';continue}
    const th=n>1?i/(n-1)*.75:0;
    if(p>=th+.25)o+=c;else if(p>0&&p>=th*.9)o+=GL[Math.floor(hash(i*7.13+seed*3.1+Math.floor(FR/3)*1.7)*GL.length)];else o+=' '}
  return o;
}
function pulse(t,list,pre=0){let v=0;for(const[c,d,a]of list){const e=t-c;if(e>=-pre&&e<d)v=Math.max(v,a*(e<0?.6:Math.pow(1-e/d,2)))}return v}

/* ===== ПРЕДРАСЧЁТ ===== */
// миниатюры «сгенерированного контента»
const TW=260,TH=170,NT=16,atlas=mk(TW*4,TH*4);
(function(){
  const a=atlas.getContext('2d'),hues=[190,320,30,95,260,170,345,210,50,280,140,10,230,300,75,200];
  for(let i=0;i<NT;i++){
    const r=rng(100+i),ox=(i%4)*TW,oy=Math.floor(i/4)*TH,h1=hues[i],h2=(h1+40+r()*80)%360;
    a.save();a.translate(ox,oy);a.beginPath();a.rect(0,0,TW,TH);a.clip();
    let g=a.createLinearGradient(0,0,TW*r(),TH);g.addColorStop(0,`hsl(${h1},85%,${16+r()*12}%)`);g.addColorStop(1,`hsl(${h2},90%,${42+r()*15}%)`);
    a.fillStyle=g;a.fillRect(0,0,TW,TH);
    const k=i%4;
    if(k===0){
      a.fillStyle=`hsl(${(h2+30)%360},100%,72%)`;a.beginPath();a.arc(TW*(.3+r()*.4),TH*.55,28+r()*25,0,TAU);a.fill();
      a.fillStyle=`hsla(${h1},60%,9%,.9)`;a.beginPath();a.moveTo(0,TH);for(let xx=0;xx<=TW;xx+=20)a.lineTo(xx,TH*(.55+r()*.25));a.lineTo(TW,TH);a.fill();
    }else if(k===1){
      for(let j=0;j<4;j++){const cx=r()*TW,cy=r()*TH,R=30+r()*60,hh=(h2+j*40)%360,rg=a.createRadialGradient(cx,cy,0,cx,cy,R);rg.addColorStop(0,`hsla(${hh},100%,72%,.95)`);rg.addColorStop(1,`hsla(${hh},100%,50%,0)`);a.fillStyle=rg;a.fillRect(0,0,TW,TH)}
    }else if(k===2){
      a.save();a.translate(TW/2,TH/2);a.rotate(r()*3);for(let j=-9;j<9;j++){a.fillStyle=`hsla(${(h2+j*12+360)%360},100%,66%,.5)`;a.fillRect(j*22,-200,10,400)}a.restore();
    }else{
      a.fillStyle=`hsla(${h1},70%,10%,.92)`;a.beginPath();a.arc(TW/2,TH*.45,32,0,TAU);a.fill();a.beginPath();a.ellipse(TW/2,TH*1.05,82,62,0,0,TAU);a.fill();
      a.strokeStyle=`hsl(${h2},100%,76%)`;a.lineWidth=3;a.beginPath();a.arc(TW/2,TH*.45,46,0,TAU);a.stroke();
    }
    g=a.createLinearGradient(0,0,0,TH);g.addColorStop(0,'rgba(255,255,255,.16)');g.addColorStop(.5,'rgba(255,255,255,0)');a.fillStyle=g;a.fillRect(0,0,TW,TH);
    a.restore();
  }
})();
function thumb(i,x,y,w,h,rad){i=((i%NT)+NT)%NT;X.save();rr(x,y,w,h,rad);X.clip();X.drawImage(atlas,(i%4)*TW,Math.floor(i/4)*TH,TW,TH,x,y,w,h);X.restore()}

// «картина» для сцены изображений — ретровейв-закат
const AW=930,AH=623,art=mk(AW,AH);
(function(){
  const a=art.getContext('2d'),hz=AH*.6,sx=AW/2,sy=hz-24,sr=165,r=rng(3);
  let g=a.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#0e0833');g.addColorStop(.45,'#561a8a');g.addColorStop(.8,'#ff3d8b');g.addColorStop(1,'#ffb347');
  a.fillStyle=g;a.fillRect(0,0,AW,hz);
  a.fillStyle='#fff';for(let i=0;i<140;i++){a.globalAlpha=r()*.8;a.fillRect(r()*AW,r()*hz*.55,1.6,1.6)}a.globalAlpha=1;
  const glow=a.createRadialGradient(sx,sy,sr*.6,sx,sy,sr*2.4);glow.addColorStop(0,'rgba(255,190,90,.55)');glow.addColorStop(1,'rgba(255,60,140,0)');a.fillStyle=glow;a.fillRect(0,0,AW,hz);
  const sun=mk(sr*2,sr*2),s=sun.getContext('2d');
  g=s.createLinearGradient(0,0,0,sr*2);g.addColorStop(0,'#fff27a');g.addColorStop(.5,'#ff8a3d');g.addColorStop(1,'#ff2f8f');
  s.fillStyle=g;s.beginPath();s.arc(sr,sr,sr,0,TAU);s.fill();
  s.globalCompositeOperation='destination-out';for(let i=0;i<8;i++)s.fillRect(0,sr+i*21,sr*2,3+i*2.3);
  a.drawImage(sun,sx-sr,sy-sr);
  [[.52,'#3a1366',90],[.42,'#1c0838',60]].forEach(([base,c,amp],j)=>{a.fillStyle=c;a.beginPath();a.moveTo(0,hz);for(let x=0;x<=AW;x+=30){const d=Math.abs(x-sx)/AW;a.lineTo(x,hz-(amp*(.4+d*1.6))*(.5+r()*.7)*(j?1:1.2))}a.lineTo(AW,hz);a.closePath();a.fill()});
  a.fillStyle='#0b0420';a.fillRect(0,hz,AW,AH-hz);
  g=a.createLinearGradient(0,hz,0,AH);g.addColorStop(0,'rgba(255,61,139,.35)');g.addColorStop(1,'rgba(255,61,139,0)');a.fillStyle=g;a.fillRect(0,hz,AW,AH-hz);
  a.strokeStyle='#ff2fd1';a.lineWidth=2;a.shadowColor='#ff2fd1';a.shadowBlur=12;
  for(let i=1;i<14;i++){const y=hz+(AH-hz)*Math.pow(i/13,2);a.globalAlpha=.25+.6*i/13;a.beginPath();a.moveTo(0,y);a.lineTo(AW,y);a.stroke()}
  a.globalAlpha=.8;for(let k=-12;k<=12;k++){a.beginPath();a.moveTo(sx+k*18,hz);a.lineTo(sx+k*230,AH);a.stroke()}
  a.globalAlpha=1;a.shadowBlur=0;
})();

// зерно, сканлайны, виньетка
const noise=mk(256,256);
(function(){const n=noise.getContext('2d'),id=n.createImageData(256,256),r=rng(9);for(let i=0;i<id.data.length;i+=4){const v=r()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}n.putImageData(id,0,0)})();
const noisePat=X.createPattern(noise,'repeat');
const scan=mk(4,4);(function(){const s=scan.getContext('2d');s.fillStyle='rgba(0,0,0,.55)';s.fillRect(0,0,4,1)})();
const scanPat=X.createPattern(scan,'repeat');
const vig=mk(W,H);(function(){const v=vig.getContext('2d'),g=v.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.05);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.78)');v.fillStyle=g;v.fillRect(0,0,W,H)})();

/* ===== ФОН / ОВЕРЛЕЙ / HUD ===== */
const DUST=[];(function(){const r=rng(21);for(let i=0;i<150;i++)DUST.push({x:r()*W,y:r()*H,z:.2+r()*.8,p:r()*TAU,c:r()<.5?'41,231,255':'255,47,209'})})();
function background(t){
  X.fillStyle=P.bg;X.fillRect(0,0,W,H);
  const bt=(t>=2&&t<3.6)||(t>=4.4&&t<12.8)?Math.exp(-((t-2)%.4)/.09):0,k=(t<2?.3+.5*pr(t,1.2,2):1)*(1+.6*bt);
  X.save();X.globalCompositeOperation='lighter';
  [[P.vi,.28,.35,.6],[P.mg,.76,.62,.5],[P.cy,.52,.18,.42]].forEach(([c,bx,by,rad],i)=>{
    const px=W*(bx+.09*Math.sin(t*.7+i*2)),py=H*(by+.08*Math.cos(t*.6+i*1.3)),R=H*rad*1.4,g=X.createRadialGradient(px,py,0,px,py,R);
    g.addColorStop(0,hexA(c,.2*k));g.addColorStop(1,hexA(c,0));X.fillStyle=g;X.fillRect(0,0,W,H);
  });
  for(const d of DUST){const y=((d.y-t*50*d.z)%H+H)%H,x=d.x+Math.sin(t*.8+d.p)*20*d.z;X.fillStyle=`rgba(${d.c},${(.1+.4*d.z)*(.6+.4*Math.sin(t*3+d.p))})`;X.fillRect(x,y,d.z*3,d.z*3)}
  X.restore();
}
function overlay(){
  X.save();X.globalAlpha=.055;X.fillStyle=noisePat;X.translate(-Math.floor(hash(FR)*256),-Math.floor(hash(FR+.5)*256));X.fillRect(0,0,W+256,H+256);X.restore();
  X.save();X.globalAlpha=.3;X.fillStyle=scanPat;X.fillRect(0,0,W,H);X.restore();
  X.drawImage(vig,0,0);
}
const NAMES=[[0,'00 — ЗАПУСК'],[2,'01 — ЗНАКОМСТВО'],[4.4,'02 — ВОЗМОЖНОСТИ'],[8.4,'03 — РЕЗУЛЬТАТ'],[10.8,'04 — МАСШТАБ'],[12.8,'05 — ФИНАЛ']];
const tc=f=>`00:00:${String(Math.floor(f/FPS)).padStart(2,'0')}:${String(f%FPS).padStart(2,'0')}`;
function hud(t,f){
  const a=E.o3(pr(t,.15,.6)),m=44,l=46;if(a<=0)return;
  X.save();X.globalAlpha=a*.8;X.strokeStyle=ink;X.lineWidth=2;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{X.beginPath();X.moveTo(x,y+sy*l);X.lineTo(x,y);X.lineTo(x+sx*l,y);X.stroke()});
  font(500,19,M);X.textBaseline='middle';X.textAlign='left';
  if(Math.floor(t*2)%2===0){X.fillStyle='#ff3b4e';X.beginPath();X.arc(m+32,m+31,7,0,TAU);X.fill()}
  X.fillStyle=ink;X.fillText('ЗАПИСЬ',m+48,m+32);
  X.globalAlpha=a*.5;X.fillText('ШОУРИЛ · ИИ-ГЕНЕРАТОР КОНТЕНТА',m+150,m+32);
  let nm=NAMES[0][1];for(const[s,n]of NAMES)if(t>=s)nm=n;
  X.textAlign='right';X.globalAlpha=a*.85;X.fillText(nm,W-m-24,m+32);
  X.textAlign='left';X.globalAlpha=a*.5;X.fillText('1920×1080 · 60 К/С · 15 С',m+24,H-m-30);
  X.textAlign='right';X.globalAlpha=a*.85;X.fillText(tc(f),W-m-24,H-m-30);
  const bw=520,bx=W/2-bw/2,by=H-m-30;
  X.globalAlpha=a*.25;X.fillStyle=ink;X.fillRect(bx,by-1,bw,2);
  X.globalAlpha=a;X.fillStyle=ink===P.wh?grad(bx,0,bx+bw,0,[P.cy,P.vi,P.mg]):ink;X.fillRect(bx,by-2,bw*(f+1)/TOTAL,4);
  X.globalAlpha=a*.6;X.fillStyle=ink;for(const[s]of NAMES)X.fillRect(bx+bw*s/DUR,by-7,2,14);
  X.restore();
}

/* ===== ПОСТОБРАБОТКА ===== */
const GLITCH=[[2,.22,1],[2.75,.1,.5],[3.6,.2,1],[3.8667,.12,.7],[4.1333,.12,.7],[4.4,.25,1],[5.2,.1,.45],[6,.1,.45],[6.8,.1,.45],[7.6,.1,.45],[8.4,.25,1],[10.8,.22,.9],[12.8,.25,1]];
const FLASH=[[2,.35,.85],[4.4,.3,.5],[8.4,.22,.4],[10.8,.25,.35],[12.8,.6,1]];
const SHAKE=[[2,.35,20],[3.6,.2,14],[3.8667,.15,10],[4.1333,.15,10],[4.4,.25,12],[8.4,.25,12],[10.8,.2,8],[12.8,.35,18]];
function chan(c,dx,dy){CH.globalCompositeOperation='source-over';CH.drawImage(buf,0,0);CH.globalCompositeOperation='multiply';CH.fillStyle=c;CH.fillRect(0,0,W,H);CH.globalCompositeOperation='source-over';out.drawImage(chn,dx,dy)}
function post(t){
  const g=pulse(t,GLITCH,.034);
  out.setTransform(1,0,0,1,0,0);out.globalAlpha=1;out.globalCompositeOperation='source-over';
  if(g<.03)out.drawImage(buf,0,0);
  else{
    out.fillStyle='#000';out.fillRect(0,0,W,H);
    const o=g*24;out.globalCompositeOperation='lighter';
    chan('#ff0000',-o,0);chan('#00ff00',0,0);chan('#0000ff',o,o*.25);
    out.globalCompositeOperation='source-over';
    const r=rng(FR*13+7),n=2+Math.floor(g*10);
    for(let i=0;i<n;i++){const sy=Math.floor(r()*(H-2)),sh=Math.max(1,Math.min(H-sy,Math.floor(4+r()*70*g))),dx=Math.round((r()-.5)*300*g);out.drawImage(buf,0,sy,W,sh,dx,sy,W,sh)}
  }
  const fl=pulse(t,FLASH);if(fl>0){out.globalAlpha=fl;out.fillStyle='#fff';out.fillRect(0,0,W,H);out.globalAlpha=1}
}
/* ===== СЦЕНА 0: ЗАПУСК (0–2 с) ===== */
const CMD='создай шоурил, который всех удивит';
const CONV=[];(function(){const r=rng(5),cs=[P.cy,P.mg,P.vi,P.wh];for(let i=0;i<260;i++)CONV.push({a:r()*TAU,r:800+r()*800,d:r()*.3,c:cs[Math.floor(r()*4)],w:1+r()*2.5})})();
function s1(t){
  const cx=W/2,cy=H/2;
  if(t<.5){const lw=E.o5(pr(t,0,.32))*1500;X.save();X.globalAlpha=1-pr(t,.32,.5);X.fillStyle=P.wh;X.shadowColor=P.cy;X.shadowBlur=40;X.fillRect(cx-lw/2,cy-2,lw,4);X.restore()}
  const op=E.o5(pr(t,.22,.55)),cl=E.i3(pr(t,1.8,1.98)),ef=t>=1.28?Math.exp(-(t-1.28)*9):0;
  const cw=1180*(1-cl*.97),ch=130*op*(1-cl)+4*cl;
  const la=E.o3(pr(t,.35,.7))*(1-pr(t,1.6,1.8));
  if(la>0){X.globalAlpha=la*.6;font(500,22,M);X.textAlign='center';X.textBaseline='middle';X.fillStyle=P.wh;X.fillText(scr('ИИ-ГЕНЕРАТОР КОНТЕНТА · СИСТЕМА ГОТОВА',pr(t,.35,.9),3),cx,cy-125);X.globalAlpha=1}
  if(op>0&&t<1.98){
    X.save();rr(cx-cw/2,cy-ch/2,cw,ch,Math.min(20,ch/2));
    X.fillStyle='rgba(16,14,32,.88)';X.fill();
    X.lineWidth=2+ef*3;X.strokeStyle=grad(cx-cw/2,0,cx+cw/2,0,[P.cy,P.vi,P.mg]);X.shadowColor=P.cy;X.shadowBlur=20+ef*60;X.stroke();X.shadowBlur=0;
    X.clip();
    const n=Math.floor(CMD.length*pr(t,.5,1.2)),s=CMD.slice(0,n),lx=cx-cw/2+50;
    font(500,46,M);X.textAlign='left';X.textBaseline='middle';
    X.fillStyle=P.cy;X.fillText('›',lx,cy+2);
    X.fillStyle=P.wh;X.fillText(s,lx+48,cy+2);
    if(t<1.25||Math.floor(t*5)%2===0){X.fillStyle=P.cy;X.fillRect(lx+54+X.measureText(s).width,cy-24,24,48)}
    X.restore();
  }
  if(t>1.28&&t<1.8){const p=pr(t,1.28,1.8),e=E.o3(p);X.save();X.globalAlpha=(1-p)*.8;X.strokeStyle=P.cy;X.lineWidth=2;rr(cx-590-e*140,cy-65-e*70,1180+e*280,130+e*140,20+e*30);X.stroke();X.restore()}
  if(t>1.3&&t<1.86){
    const gp=E.io3(pr(t,1.32,1.78)),bw=1180,by=cy+112;
    X.save();X.globalAlpha=1-pr(t,1.74,1.86);
    X.fillStyle='rgba(255,255,255,.12)';X.fillRect(cx-bw/2,by,bw,4);
    X.fillStyle=grad(cx-bw/2,0,cx+bw/2,0,[P.cy,P.vi,P.mg]);X.fillRect(cx-bw/2,by,bw*gp,4);
    font(500,22,M);X.textBaseline='middle';X.fillStyle=P.wh;X.textAlign='left';X.fillText('генерация шоурила…',cx-bw/2,by+36);
    X.textAlign='right';X.fillText(Math.round(gp*100)+'%',cx+bw/2,by+36);
    X.restore();
  }
  if(t>1.25){
    X.save();X.globalCompositeOperation='lighter';X.lineCap='round';
    for(const p of CONV){
      const q=pr(t,1.25+p.d,1.98);if(q<=0||q>=1)continue;
      const r1=p.r*(1-E.i3(q)),r0=p.r*(1-E.i3(Math.max(0,q-.14))),c=Math.cos(p.a),s=Math.sin(p.a)*.75;
      X.strokeStyle=p.c;X.globalAlpha=.2+.8*q;X.lineWidth=p.w;
      X.beginPath();X.moveTo(cx+c*r0,cy+s*r0);X.lineTo(cx+c*r1,cy+s*r1);X.stroke();
    }
    const k=E.i3(pr(t,1.55,2));
    if(k>0){const R=40+620*k,g=X.createRadialGradient(cx,cy,0,cx,cy,R);g.addColorStop(0,`rgba(255,255,255,${k})`);g.addColorStop(.2,hexA(P.cy,.65*k));g.addColorStop(1,hexA(P.vi,0));X.globalAlpha=1;X.fillStyle=g;X.fillRect(0,0,W,H)}
    X.restore();
  }
}

/* ===== СЦЕНА 4: МАСШТАБ (10,6–12,8 с) ===== */
const TREE=[];(function(){

/* ===== СЦЕНА 5: ФИНАЛ (12,8–15 с) ===== */
function star(R,r){X.beginPath();X.moveTo(R,0);for(let k=1;k<=4;k++){const a=k*Math.PI/2,b=a-Math.PI/4;X.quadraticCurveTo(Math.cos(b)*r,Math.sin(b)*r,Math.cos(a)*R,Math.sin(a)*R)}X.closePath()}
function emblem(cx,cy,t){
  const a=E.o3(pr(t,0,.4)),sc=lerp(.6,1,Math.max(0,E.ob(pr(t,0,.55))));

    X.save();X.translate(52,-52);X.rotate(-t);X.scale(sp*.32,sp*.32);star(80,15);X.fillStyle=P.wh;X.fill();X.restore()}
  for(let k=0;k<3;k++){const an=t*2.2+k*TAU/3;X.globalAlpha=a;X.fillStyle=[P.cy,P.mg,P.lm][k];X.beginPath();X.arc(Math.cos(an)*150,Math.sin(an)*150,6,0,TAU);X.fill()}

}
const TITLE='ИИ-ГЕНЕРАТОР КОНТЕНТА',SUB='Ваша идея — мой следующий шедевр',READY='› готов к новым задачам';
function s6(t){
  const cx=W/2,ey=345;

  for(let i=0;i<24;i++){X.rotate(TAU/24);X.fillStyle=hexA(i%2?P.cy:P.vi,ra);X.beginPath();X.moveTo(0,0);X.lineTo(1300,-60);X.lineTo(1300,60);X.closePath();X.fill()}
  X.restore();
  const gl=X.createRadialGradient(cx,ey,0,cx,ey,400);gl.addColorStop(0,hexA(P.vi,.45*E.o3(pr(t,0,.5))));gl.addColorStop(1,hexA(P.vi,0));X.fillStyle=gl;X.fillRect(0,0,W,H);

  X.globalAlpha=E.o3(pr(t,.6,.85));font(500,40,F);X.textAlign='center';X.fillStyle='rgba(245,243,255,.88)';X.fillText(scr(SUB,pr(t,.6,1.15),8),cx,712);
  font(700,22,F);const pw=CAP.map(([s])=>X.measureText(s).width+52),tot=pw.reduce((a,b)=>a+b,0)+16*4;let px=cx-tot/2;

}

/* ===== РЕНДЕР ===== */
const SC=[[0,2,s1],[2,4.4,s2],[4.4,8.4,s3],[8.4,10.8,s4],[10.8,12.8,s5],[12.8,99,s6]];
function render(f){
  FR=f;const t=f/FPS;
  X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';X.setLineDash([]);
  background(t);
  const s=pulse(t,SHAKE);
  X.save();X.translate((hash(f*3.7)-.5)*2*s,(hash(f*5.3)-.5)*2*s);
  for(const[a,b,fn]of SC)if(t>=a&&t<b){X.save();fn(t-a);X.restore();break}
  X.restore();
  overlay();
  ink=t>=3.6&&t<4.4?P.bg:P.wh;
  hud(t,f);
  post(t);
}
const Q=new URLSearchParams(location.search).get('t');
let start=null,last=-1,running=false;
function tick(now){
  if(start===null)start=now;
  const el=(now-start)/1000,f=Math.min(TOTAL-1,Math.floor(el*FPS));
  if(f!==last){render(f);last=f}
  if(el<DUR)requestAnimationFrame(tick);else{if(last!==TOTAL-1)render(TOTAL-1);running=false}
}
function play(){if(running)return;running=true;start=null;last=-1;requestAnimationFrame(tick)}
if(Q!==null)render(Math.max(0,Math.min(TOTAL-1,Math.round(parseFloat(Q)*FPS))));else play();
view.addEventListener('click',()=>{if(Q===null)play()});
