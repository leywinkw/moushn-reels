name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: latent-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: latent-site/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Add showreel
        run: cp ../showreel.html ../showreel.mp4 out/ && touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: latent-site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
